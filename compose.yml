# Brings up MakerChecker (Postgres + server) for the OpenEmployee demos and
# integration tests. Requires the vendored source (run ./setup.sh first).
# The server seeds a demo admin and prints an API key at boot:
#   docker compose logs makerchecker | grep 'API KEY'
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: makerchecker
      POSTGRES_PASSWORD: makerchecker
      POSTGRES_DB: makerchecker
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U makerchecker"]
      interval: 2s
      timeout: 3s
      retries: 15

  makerchecker:
    build:
      context: ./vendor/makerchecker
      dockerfile: packages/server/Dockerfile
    environment:
      DATABASE_URL: postgres://makerchecker:makerchecker@postgres:5432/makerchecker
      PORT: "3000"
      MAKERCHECKER_DATA_DIR: /data
      MAKERCHECKER_SEED_DEMO: "1"
      DEMO_DATA_DIR: /app/examples/daily-cash-reconciliation
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
